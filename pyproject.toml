[project]
name = "stock-intel"
version = "0.1.0"
description = "국장 주식 투자 데이터 통합 Telegram 봇"
requires-python = ">=3.12"
dependencies = [
    "pykrx>=1.0.0",
    "pandas-ta>=0.3.14b",
    "python-telegram-bot>=20.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.0.0",
    "apscheduler>=3.10.0",
    "kreports>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data", "utils"]

[tool.uv]
required-version = ">=0.4"
